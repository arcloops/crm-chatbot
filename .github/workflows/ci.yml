name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret-key
      JWT_EXPIRES_IN: 1d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write root .env for Prisma CLI
        run: |
          cat > .env << EOF
          DATABASE_URL=${{ env.DATABASE_URL }}
          REDIS_URL=${{ env.REDIS_URL }}
          PORT=4000
          CORS_ORIGIN=http://localhost:3000
          JWT_SECRET=${{ env.JWT_SECRET }}
          JWT_EXPIRES_IN=1d
          NODE_ENV=test
          NEXT_PUBLIC_API_URL=http://localhost:4000
          EOF

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Start API
        run: npm run start -w backend &
        env:
          NODE_ENV: production

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: E2E smoke
        run: node scripts/e2e-smoke.js

      - name: Verify phase 10-13
        run: node scripts/verify-phase1013.js
